<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hockey Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>League Stats</h1>
</div>

<div class="controls">
  <button id="loginBtn">Admin Login</button>
  <button id="addPlayerBtn" hidden>Add Player</button>
  <button id="resetSeasonBtn" hidden>New Season Reset</button>
</div>

<div class="sortBar">
  <button id="sortPointsBtn">Points</button>
  <button id="sortGoalsBtn">Goals</button>
  <button id="sortAssistsBtn">Assists</button>
</div>

<h2>Skaters</h2>
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>G</th>
      <th>A</th>
      <th>P</th>
      <th>SOG</th>
      <th>MVP</th>
      <th>🗑</th>
    </tr>
  </thead>
  <tbody id="skatersBody"></tbody>
</table>

<h2>Goalies</h2>
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>A</th>
      <th>P</th>
      <th>MVP</th>
      <th>Saves</th>
      <th>🗑</th>
    </tr>
  </thead>
  <tbody id="goaliesBody"></tbody>
</table>

<script type="module" src="script.js"></script>
</body>
</html>
